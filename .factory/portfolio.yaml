# portfolio.yaml — edoworks org + local factory repos and surfaces
# Every repo gets an explicit disposition. No accidental immortality.

active_factory: edoworks/sf0.8
active_private_product: null
shelved_private_product: edoworks/product-a
active_commercial_experiment: edoworks/rung
policy: >-
  sf0.8 is the sole active factory. Deprecated or frozen predecessors are
  read-only evidence and require explicit owner authorization for revival.

repos:
  - id: edoworks/sf0.8
    visibility: private
    lifecycle: active
    disposition: keep
    purpose: factory engine/template; design review + governance + harness evidence
    health.last_reviewed: 2026-09-13
    health.next_review_due: 2026-10-13
    destructive_actions: {delete_repo: human_only, make_public: human_only}

  - id: edoworks/product-a
    visibility: private
    lifecycle: shelved
    disposition: keep_read_only
    source_of_truth: https://github.com/edoworks/product-a.git
    default_branch: main
    successor_of: foculoom/sf0.7/apps/catwhispers
    purpose: "Mews & Woofs" — iOS/iPadOS local adaptive pet-play experiment
    read_only: true
    resume_requires_owner_instruction: true
    product_work: prohibited
    knowledge_and_artifacts: preserved
    autonomous_resumption: prohibited
    archive_eligibility:
      state: blocked
      reason: "External repository archive state and release/archive evidence require owner-authorized lifecycle processing."
    revival_issue: https://github.com/edoworks/sf0.8/issues/30
    revival_decision: docs/decisions/2026-09-18-adaptive-play-revival.md
    health.last_verified_build: 2026-09-13
    health.last_reviewed: 2026-09-13
    health.next_review_due: 2026-10-13
    open_source:
      candidate: true
      ready: false
      blockers: [ip_review, secret_history_scan, privacy_review, bundle_id_rename(com.foculoom→ai.edoworks)]
    destructive_actions: {delete_repo: human_only, make_public: human_only}

  - id: foculoom/vorynce
    visibility: private
    lifecycle: active
    disposition: simplify
    source_of_truth: https://github.com/foculoom/vorynce.git
    default_branch: master
    purpose: local-only voice capture and organization app
    read_only: false
    destructive_actions: {delete_repo: human_only, make_public: human_only}

  - id: foculoom/sf0.7
    visibility: private
    lifecycle: deprecated
    disposition: keep_read_only
    successor_of: edoworks/sf0.8
    purpose: predecessor factory runtime; Cat Whispers history, evidence trail, and historical queue
    working_root: /Users/hello/sf0.7
    read_only: true
    resume_requires_owner_instruction: true
    health.last_reviewed: 2026-09-13
    health.next_review_due: 2026-10-13
    open_source:
      candidate: false
      ready: false
      blockers: [mixed_personal_and_work_history, signing_evidence_present]
    destructive_actions: {delete_repo: human_only, make_public: human_only, merge_into_sf0.8: human_only}

  - id: foculoom/sf0.5
    visibility: private
    lifecycle: frozen_legacy
    disposition: keep_read_only
    successor_of: foculoom/sf0.7
    purpose: legacy factory and product evidence archive
    working_root: /Users/hello/sf0.5
    read_only: true
    resume_requires_owner_instruction: true
    destructive_actions: {delete_repo: human_only, make_public: human_only}

surfaces:
  - id: edoworks/factory-constitution
    type: public_template
    lifecycle: active
    disposition: keep
    source_of_truth: https://github.com/edoworks/factory-constitution
    purpose: public thin-factory constitution, skills, and 5-Whys templates
  - id: edoworks/edoworks.github.io
    type: public_distribution_surface
    lifecycle: active
    disposition: keep
    source_of_truth: https://github.com/edoworks/edoworks.github.io
    purpose: Edoworks portfolio, release notes, and engineering case studies
  - id: rung.edoworks.com
    type: public_web_surface
    lifecycle: active
    health: degraded
    disposition: keep
    source_of_truth: https://github.com/edoworks/rung
    purpose: Rung public web distribution URL; currently returning Cloudflare 530
  - id: edoworks/rung
    type: public_product
    lifecycle: active
    disposition: keep
    source_of_truth: /Users/hello/rung
    purpose: free governance-evidence CLI and organic funnel to paid audits
  - id: edoworks/rung-audit
    type: public_distribution_surface
    lifecycle: active
    disposition: keep
    source_of_truth: /Users/hello/rung
    purpose: versioned PyPI distribution of Rung
  - id: edoworks/rungreport
    type: private_service
    lifecycle: parked
    disposition: do_not_build
    source_of_truth: /Users/hello/rungreport
    purpose: conditional hosted report service; requires paid-audit evidence
  - id: foculoom/rendit
    type: internal_developer_tool
    lifecycle: conditional
    disposition: keep_internal
    source_of_truth: /Users/hello/foculoom/tools/rendit
    purpose: deterministic asset pipeline; public split remains founder-gated
  - id: edoworks/flocal
    type: internal_tool
    lifecycle: internal
    disposition: keep_internal
    source_of_truth: /Users/hello/flocal
    purpose: local factory benchmark and control-plane experiment

inventory_notes:
  - scope includes sf0.8, its known predecessors, and reviewed local public/internal surfaces
  - lifecycle review cadence: monthly; triage must not consume product shipping (design review)

# Canonical Apple product inventory. Distribution tooling must enumerate this
# section rather than maintaining a second product registry.
apple_products:
  - id: product-a
    repository: edoworks/product-a
    source_of_truth: https://github.com/edoworks/product-a.git
    platform: iOS/iPadOS
    lifecycle: active
    release_state: never_released
    bundle_id: com.foculoom.ProductA
  - id: vorynce
    repository: foculoom/vorynce
    source_of_truth: https://github.com/foculoom/vorynce.git
    platform: iOS
    lifecycle: active
    release_state: previously_released
    bundle_id: com.foculoom.vorynce

