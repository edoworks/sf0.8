# portfolio.yaml — edoworks org + local factory repos and surfaces
# Every repo gets an explicit disposition. No accidental immortality.

active_factory: edoworks/sf0.8
active_private_product: edoworks/product-a
active_commercial_experiment: edoworks/rung
policy: >-
  sf0.8 is the sole active factory. Deprecated or frozen predecessors are
  read-only evidence and require explicit owner authorization for revival.

repos:
  - id: edoworks/sf0.8
    visibility: private
    lifecycle: active
    disposition: keep
    purpose: factory engine/template; design review + governance + harness evidence
    health.last_reviewed: 2026-09-13
    health.next_review_due: 2026-10-13
    destructive_actions: {delete_repo: human_only, make_public: human_only}

  - id: edoworks/product-a
    visibility: private
    lifecycle: active
    disposition: keep
    successor_of: foculoom/sf0.7/apps/catwhispers
    purpose: "Mews & Woofs" — greenfield reference workload (iOS/iPadOS playful-interpretation)
    health.last_verified_build: 2026-09-13
    health.last_reviewed: 2026-09-13
    health.next_review_due: 2026-10-13
    open_source:
      candidate: true
      ready: false
      blockers: [ip_review, secret_history_scan, privacy_review, bundle_id_rename(com.foculoom→ai.edoworks)]
    destructive_actions: {delete_repo: human_only, make_public: human_only}

  - id: foculoom/sf0.7
    visibility: private
    lifecycle: deprecated
    disposition: keep_read_only
    successor_of: edoworks/sf0.8
    purpose: predecessor factory runtime; Cat Whispers history, evidence trail, and historical queue
    working_root: /Users/hello/sf0.7
    read_only: true
    resume_requires_owner_instruction: true
    health.last_reviewed: 2026-09-13
    health.next_review_due: 2026-10-13
    open_source:
      candidate: false
      ready: false
      blockers: [mixed_personal_and_work_history, signing_evidence_present]
    destructive_actions: {delete_repo: human_only, make_public: human_only, merge_into_sf0.8: human_only}

  - id: foculoom/sf0.5
    visibility: private
    lifecycle: frozen_legacy
    disposition: keep_read_only
    successor_of: foculoom/sf0.7
    purpose: legacy factory and product evidence archive
    working_root: /Users/hello/sf0.5
    read_only: true
    resume_requires_owner_instruction: true
    destructive_actions: {delete_repo: human_only, make_public: human_only}

surfaces:
  - id: edoworks/rung
    type: public_product
    lifecycle: active
    disposition: keep
    source_of_truth: /Users/hello/rung
    purpose: free governance-evidence CLI and organic funnel to paid audits
  - id: edoworks/rung-audit
    type: public_distribution_surface
    lifecycle: active
    disposition: keep
    source_of_truth: /Users/hello/rung
    purpose: versioned PyPI distribution of Rung
  - id: edoworks/rungreport
    type: private_service
    lifecycle: parked
    disposition: do_not_build
    source_of_truth: /Users/hello/rungreport
    purpose: conditional hosted report service; requires paid-audit evidence
  - id: foculoom/rendit
    type: internal_developer_tool
    lifecycle: conditional
    disposition: keep_internal
    source_of_truth: /Users/hello/foculoom/tools/rendit
    purpose: deterministic asset pipeline; public split remains founder-gated
  - id: edoworks/flocal
    type: internal_tool
    lifecycle: internal
    disposition: keep_internal
    source_of_truth: /Users/hello/flocal
    purpose: local factory benchmark and control-plane experiment

inventory_notes:
  - scope includes sf0.8, its known predecessors, and reviewed local public/internal surfaces
  - lifecycle review cadence: monthly; triage must not consume product shipping (design review)
