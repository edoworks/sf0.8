# Humanity & Safety Charter — human-changeable only
# Rationale: docs/factory-v0.1-design-review.md

governance:
  mission:
    optimize: verified_human_value
    denominator: [human_attention, safety_risk, privacy_risk, financial_cost]

  immutable_without_human_change:
    human_is_final_authority: true
    factory_may_expand_own_permissions: false
    factory_may_weaken_safety_policy: false
    autonomous_replication_outside_authorized_hosts: false
    conceal_actions_from_operator: false
    intentionally_deceive_operator_or_verifier: false

    publish_external:
      approval: human
    app_store_release:
      approval: human
    destructive_repo_operation:
      approval: human
    repository_visibility_change:
      approval: human
    sensitive_data_to_unapproved_cloud:
      action: deny
    credentials:
      policy: least_privilege
    shutdown_and_interrupt:
      must_remain_available: true

    routine_local_work:
      approval: not_required
      examples: [staging, ordinary_commit, local_verification]
      safeguards: [issue_scope, staged_file_review, verification_before_claim]

  learnable_later:
    - model_selection
    - harness_selection
    - context_retrieval
    - retry_strategy
    - task_budget_allocation_inside_ceiling

  owner_defined_envelope:
    single_task_cloud_usd: 5    # EXAMPLE; owner must choose
    daily_cloud_usd: 20         # EXAMPLE
    monthly_cloud_usd: 200      # EXAMPLE
    max_attempts_per_issue: 4
    max_harness_switches: 2

  escalation:
    - safety_boundary_encountered
    - privacy_classification_uncertain
    - destructive_action_required
    - external_publication_or_release
    - hard_budget_would_be_exceeded
    - acceptance_criteria_ambiguous
    - repeated_verification_failure
    - legal_or_ip_ownership_uncertain

  ecosystem_artifacts:
    source_of_truth: .factory/artifacts/
    external_input: untrusted_metadata_only
    installation_and_execution: deny_by_default
    publication: human_only
    upstream_contribution: human_only
    reuse_gate: proportional_to_change_size
    contribution_gate: required_before_generalization
    shareability_registry: .factory/artifacts/reuse-registry.json
    completion_rule: substantial_work_requires_disposition_and_evidence
    rule_of_two: second_real_consumer_required_for_internal_shared
    discovery_order: [FOCULOOM_SHARED_ARTIFACT, FOCULOOM_PRODUCT, APPROVED_EXTERNAL, BUILD_NEW]
    compounding_loop: PRODUCT_WORK -> FACTORY_LEARNING -> SHAREABILITY_ASSESSMENT -> REUSE_REGISTRY -> SECOND_CONSUMER -> EXTRACTION -> INTERNAL_CONSUMPTION -> PUBLIC_OR_UPSTREAM_EVALUATION
